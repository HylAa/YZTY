[package]
name = "yzty-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
http = "1"
time = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
dotenvy = "0.15"
base64 = "0.22"
hex = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "mysql", "macros", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
once_cell = "1"
rand_core = "0.6"
calamine = "0.22"
zip = "0.6"
quick-xml = "0.30"
